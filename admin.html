<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0f766e"><title>Admin - Money Tracker</title><link rel="stylesheet" href="style.css"></head><body><main>
<h1>Admin dashboard</h1><p id="st" class="hint">Loading...</p>
<section id="login" hidden><input id="em" type="email" placeholder="Admin email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Sign in</button><button id="gg" class="alt">Continue with Google</button></section>
<section id="panel" hidden>
<p><span id="who" class="hint"></span> <button id="so" class="alt" style="width:auto">Sign out</button> <a class="btn" href="/">Open app</a></p>
<h3>Scrolling notice</h3><textarea id="nt" rows="2" maxlength="300" placeholder="Notice text shown to every user"></textarea><label><input id="non" type="checkbox">Show notice</label>
<h3>Slides (swipe banners)</h3><div id="sl"></div><button id="addsl" class="alt">+ Add slide</button><button id="save">Save notice and slides</button>
<h3>Messages <small id="mc"></small></h3><ul id="inbox"></ul></section></main><script type="module" src="admin.js"></script></body></html>
