<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Wallet</title><link rel="stylesheet" href="style.css"></head><body><main>
<section id="auth" hidden><h1>My Wallet</h1><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (min 6 characters)"><button id="login">Sign in</button><button id="signup" class="alt">Create account</button><button id="google" class="alt">Continue with Google</button><p id="err" class="err"></p></section>
<section id="onboard" hidden><h2>Set up your wallet</h2><input id="cur" placeholder="Currency code, e.g. BDT" value="BDT"><input id="accName" placeholder="First account name" value="Cash"><input id="accBal" type="number" step="0.01" placeholder="Starting balance" value="0"><button id="start">Start tracking</button></section>
<section id="app" hidden>
<header><h2>My Wallet</h2><button id="out" class="alt">Sign out</button></header>
<div class="cards"><div><small>Total balance</small><b id="tot"></b></div><div><small>Income this month</small><b id="inc"></b></div><div><small>Spent this month</small><b id="exp"></b></div></div>
<h3>Accounts</h3><ul id="accs"></ul>
<div class="row"><input id="nAcc" placeholder="New account name"><input id="nBal" type="number" step="0.01" placeholder="Balance"><button id="addAcc">Add account</button></div>
<h3>Add record</h3>
<div class="grid"><select id="type"><option>expense</option><option>income</option><option>transfer</option></select><input id="amt" type="number" step="0.01" placeholder="Amount"><select id="from"></select><select id="to"></select><select id="cat"></select><input id="date" type="date"><input id="note" placeholder="Note (optional)"><button id="save">Save record</button></div>
<h3>Records</h3><ul id="recs"></ul>
</section></main><script type="module" src="app.js"></script></body></html>
